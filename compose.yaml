services:
  js-eyes:
    build: .
    init: true
    restart: unless-stopped
    environment:
      # Container networking requires this opt-in; the published port stays local.
      JS_EYES_ALLOW_REMOTE_BIND: "1"
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - js-eyes-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/api/browser/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  js-eyes-data:
