<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>Meta title</title>
  <link rel="canonical" href="https://example.com/news/canonical">
  <meta name="author" content="Ada Lovelace">
  <meta name="description" content="Short excerpt">
  <meta property="og:site_name" content="Example News">
  <meta property="article:published_time" content="2024-01-15T10:00:00Z">
  <meta property="article:modified_time" content="2024-02-01T12:00:00Z">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "JSON-LD headline",
    "datePublished": "2024-01-15T10:00:00Z",
    "dateModified": "2024-02-01T12:00:00Z",
    "author": { "@type": "Person", "name": "Ada Lovelace" },
    "description": "JSON-LD description"
  }
  </script>
</head>
<body>
  <article>
    <h1>JSON-LD headline</h1>
    <p>Published report body with enough characters for the article landmark to be used as the content root.</p>
  </article>
</body>
</html>
