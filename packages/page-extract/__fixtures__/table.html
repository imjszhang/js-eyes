<!DOCTYPE html>
<html lang="en">
<head>
  <title>Spec table</title>
</head>
<body>
  <article>
    <h1>Device specs</h1>
    <table>
      <thead>
        <tr>
          <th>Model</th>
          <th>RAM</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alpha</td>
          <td>8 GB</td>
          <td>$199</td>
        </tr>
        <tr>
          <td>Beta</td>
          <td>16 GB</td>
          <td>$299</td>
        </tr>
      </tbody>
    </table>
  </article>
</body>
</html>
