<!DOCTYPE html>
<html lang="en">
<head>
  <title>Nested lists</title>
</head>
<body>
  <article>
    <h1>Setup</h1>
    <ol>
      <li>Install runtime
        <ol>
          <li>Download the package</li>
          <li>Verify the checksum</li>
        </ol>
      </li>
      <li>Configure
        <ul>
          <li>Set the server URL</li>
          <li>Enable the extension</li>
        </ul>
      </li>
      <li>Run a smoke test</li>
    </ol>
  </article>
</body>
</html>
